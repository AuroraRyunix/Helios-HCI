[package]
name = "sidon"
version = "0.1.0"
license = "BUSL-1.1"
edition = "2021"

# Deliberately thin. Everything on the byte path is std: files, threads, unix sockets.
# serde_json is here because the metadata layer speaks JSON to Daruk and hand-rolling a
# parser for someone else's output is how you get a parser that is subtly wrong on the
# day the output changes.
[dependencies]
serde_json = "1.0"
# Mutual TLS on the replication port. 0.21 to match agahnim, which already ships rustls
# on these nodes -- same version means one copy in the registry and one audit surface.
# Plain rustls, not tokio-rustls: this daemon's byte path is blocking threads and std,
# and pulling in an async runtime for the transport would restructure the data path to
# solve a problem it does not have.
rustls = "0.21"
rustls-pemfile = "1.0"

[profile.release]
opt-level = 2
panic = "unwind"
